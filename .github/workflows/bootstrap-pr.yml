name: Verify v0.7 candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: verify-v07-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'predeploy/v0.7'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      CONTACT_MODE: "mock"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Verify source structure
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f app/page.tsx
          test -f app/layout.tsx
          test -f app/globals.css
          test -f .github/workflows/ci.yml
          test -f DEPLOYMENT_CHECKLIST.md
          test -f SECURITY.md
          test "$(find . -type f -not -path './.git/*' | wc -l | tr -d ' ')" -ge "67"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate source
        run: npm run validate

      - name: Production build
        run: npm run build

      - name: Smoke test production server
        shell: bash
        run: |
          npm run start > /tmp/mediacre-next.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          curl -fsS http://127.0.0.1:3000/work >/dev/null
          curl -fsS http://127.0.0.1:3000/contact >/dev/null
