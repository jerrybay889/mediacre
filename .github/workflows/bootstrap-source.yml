name: Bootstrap v0.7 source

on:
  push:
    branches:
      - predeploy/v0.7
    paths:
      - '.source/mediacre-v0.7-source.tar.gz'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-v0.7
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: predeploy/v0.7
          fetch-depth: 0
          persist-credentials: true

      - name: Expand production candidate
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf .source/mediacre-v0.7-source.tar.gz >/dev/null
          tar -xzf .source/mediacre-v0.7-source.tar.gz -C .
          rm -rf .source
          rm -f .github/workflows/bootstrap-source.yml
          rm -f SOURCE_UPLOAD_IN_PROGRESS.md

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f app/page.tsx
          test -f app/layout.tsx
          test -f .github/workflows/ci.yml
          test -f DEPLOYMENT_CHECKLIST.md
          test -f SECURITY.md

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import MEDIA CRE production candidate v0.7"
          git push origin HEAD:predeploy/v0.7
