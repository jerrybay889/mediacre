name: CI
on:
  push:
    branches: [main, predeploy/v0.7]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      CONTACT_MODE: "mock"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run validate
      - run: npm run build
      - name: Smoke test production server
        shell: bash
        run: |
          npm run start > /tmp/mediacre-next.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/api/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          curl -fsS http://127.0.0.1:3000/work >/dev/null
          curl -fsS http://127.0.0.1:3000/contact >/dev/null

